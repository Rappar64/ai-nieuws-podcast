<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Nieuws</title>
<meta name="description" content="Het belangrijkste uit de wereld van AI, elke ochtend in vijf minuten.">
<meta name="theme-color" content="#0f081f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Nieuws">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="alternate" type="application/rss+xml" title="AI Nieuws" href="feed.xml">
<style>
:root {
  --ink: #0f081f; --plum: #301257; --violet: #753be0; --lilac: #c2a3ff;
  --orange: #ff7821; --ember: #c74229; --amber: #ffba61;
  --accent: linear-gradient(135deg, var(--violet), var(--orange));
  --warm: linear-gradient(90deg, var(--orange), var(--amber));
  --serif: "New York", ui-serif, "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--ink); color: #fff; font-family: var(--sans); }
body { min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body.player-open { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }

/* Achtergrond: bewegende paars/oranje mesh */
#aurora { position: fixed; inset: -6%; width: 112%; height: 112%; z-index: 0; filter: blur(14px); }
.aurora-shade { position: fixed; inset: 0; background: rgba(15, 8, 31, .12); z-index: 0; pointer-events: none; }

.eyebrow { font-size: 11px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
.display { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; }

.glass {
  position: relative; border-radius: 28px;
  background: rgba(28, 16, 52, .34);
  -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5);
  box-shadow: 0 12px 48px rgba(15, 8, 31, .5);
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.35), rgba(194,163,255,.08), rgba(255,120,33,.35));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.press { transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.press:active { transform: scale(.92); }

/* ---------- Home ---------- */
#home {
  position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding: calc(var(--st) + 20px) 20px calc(var(--sb) + 130px);
  display: flex; flex-direction: column; gap: 28px;
  transition: opacity .45s, transform .45s cubic-bezier(.2,.9,.25,1);
}
body.player-open #home { opacity: 0; transform: scale(.94); pointer-events: none; }
header .eyebrow { color: var(--amber); }
header h1 { margin: 6px 0 6px; font-size: 40px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
header h1 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 10px var(--orange); }
header p { margin: 0; font-size: 15px; color: rgba(255,255,255,.65); line-height: 1.4; }

.hero { padding: 22px; display: flex; flex-direction: column; gap: 18px; animation: rise .7s cubic-bezier(.2,.9,.25,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }
.hero-top { display: flex; align-items: center; justify-content: space-between; }
.pill { background: var(--warm); color: var(--ink); padding: 5px 10px; border-radius: 99px; }
.dur { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.7); }
.dur svg { width: 13px; height: 13px; }
.hero h2 { margin: 0; font-size: 26px; line-height: 1.18; }
.hero .summary { margin: 0; font-size: 15px; line-height: 1.45; color: rgba(255,255,255,.7);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.headlines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.headlines li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; line-height: 1.35; color: rgba(255,255,255,.88); }
.headlines li span { font-size: 12px; font-weight: 650; color: var(--orange); font-variant-numeric: tabular-nums; }
.hero-play { display: flex; align-items: center; gap: 16px; padding-top: 4px; }
.bigplay { position: relative; flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 12px rgba(255,120,33,.5), inset 0 0 0 1px rgba(255,255,255,.3); display: grid; place-items: center; }
.bigplay svg { width: 26px; height: 26px; }
.bigplay .i-play { transform: translateX(2px); }
.hp-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.hp-text strong { font-size: 15px; font-weight: 600; }
.hp-text small { font-size: 12px; color: rgba(255,255,255,.6); }
.bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--orange); border-radius: inherit; }

.eq { display: inline-flex; align-items: center; gap: 2px; width: 14px; height: 14px; color: var(--amber); flex: none; }
.eq i { flex: 1; height: 30%; border-radius: 2px; background: currentColor; animation: eq .9s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: -.33s; } .eq i:nth-child(3) { animation-delay: -.66s; }
@keyframes eq { from { height: 30%; } to { height: 100%; } }

.section-title { color: rgba(194,163,255,.8); margin: 0 0 12px 4px; }
.archive { border-radius: 24px; }
.ep { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; text-align: left; position: relative; }
.ep + .ep::before { content: ""; position: absolute; top: 0; left: 76px; right: 0; height: 1px; background: rgba(255,255,255,.08); }
.ep .date { flex: none; width: 48px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.06);
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ep .date b { font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1; }
.ep .date small { font-size: 10px; font-weight: 650; color: var(--amber); margin-top: 3px; letter-spacing: .04em; }
.ep .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.ep .meta strong { font-size: 15px; font-weight: 600; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ep .meta span { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,.55); }
.ep .meta .bar { width: 50px; height: 3px; }
.ep .meta svg { width: 11px; height: 11px; }
.ep .go { flex: none; width: 28px; height: 28px; display: grid; place-items: center; }
.ep .go .circle { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.ep .go .circle svg { width: 12px; height: 12px; transform: translateX(1px); }
.ep:active { background: rgba(255,255,255,.04); }
.ep:first-child { border-radius: 24px 24px 0 0; } .ep:last-child { border-radius: 0 0 24px 24px; }

.empty { padding: 28px; text-align: center; color: rgba(255,255,255,.75); font-size: 15px; line-height: 1.45; }
.empty svg { width: 44px; height: 44px; margin: 0 auto 14px; color: var(--orange); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.loading { min-height: 240px; display: grid; place-items: center; }
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.install { padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: rgba(255,255,255,.85); }
.install svg { flex: none; width: 22px; height: 22px; color: var(--amber); margin-top: 1px; }
.install b { color: #fff; }
.install .x { margin-left: auto; flex: none; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; }
.install .x svg { width: 12px; height: 12px; color: #fff; margin: 0; }
footer { text-align: center; font-size: 12px; color: rgba(255,255,255,.45); }
footer a { color: rgba(255,186,97,.8); }

/* ---------- Mini-speler ---------- */
#mini {
  position: fixed; z-index: 10; left: 12px; right: 12px; bottom: calc(var(--sb) + 8px);
  max-width: 536px; margin: 0 auto; border-radius: 26px;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; cursor: pointer;
  transform: translateY(160%); transition: transform .5s cubic-bezier(.2,1.2,.3,1);
}
#mini.show { transform: none; }
body.player-open #mini { transform: translateY(160%); }
.mini-orb { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.mini-bars { display: flex; align-items: center; gap: 2px; width: 18px; height: 16px; }
.mini-bars i { flex: 1; height: 3px; border-radius: 2px; background: #fff; }
.mini-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.mini-text strong { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-text small { font-size: 12px; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
#mini .ctl { flex: none; display: grid; place-items: center; height: 40px; width: 36px; }
#mini .ctl svg { width: 24px; height: 24px; }
#mini .ctl.skip svg { width: 26px; height: 26px; }
.mini-prog { position: absolute; left: 22px; right: 22px; bottom: 0; height: 2px; }
.mini-prog i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--warm); }

/* ---------- Volledige speler ---------- */
#player {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
  padding: calc(var(--st) + 8px) 0 calc(var(--sb) + 12px);
  transform: translateY(100%); visibility: hidden;
  transition: transform .55s cubic-bezier(.2,.9,.25,1), visibility 0s .55s;
}
body.player-open #player { transform: none; visibility: visible; transition: transform .55s cubic-bezier(.2,.9,.25,1), visibility 0s; }
.p-inner { flex: 1; min-height: 0; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.round { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; }
.round svg { width: 18px; height: 18px; }
.topbar .mid { text-align: center; }
.topbar .mid .eyebrow { color: rgba(255,255,255,.6); }
.topbar .mid div:last-child { font-size: 15px; font-weight: 600; margin-top: 2px; }

.orb-wrap { flex: 1 1 auto; min-height: 180px; max-height: 360px; display: grid; place-items: center; padding: 8px 0; }
.orb { position: relative; width: min(82vw, 340px); aspect-ratio: 1; max-height: 100%; }
.orb > * { position: absolute; inset: 0; border-radius: 50%; }
.ring { background: var(--accent); opacity: 0;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1.4px), #000 calc(100% - 1.2px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 1.4px), #000 calc(100% - 1.2px)); }
.glow { background: conic-gradient(var(--violet), var(--orange), var(--amber), var(--lilac), var(--violet)); opacity: .75; }
.core { overflow: hidden; box-shadow: 0 0 30px rgba(255,120,33,.35); }
.core .spin { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--plum), var(--violet), var(--orange), var(--ember), var(--plum)); }
.core .shine { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.45), transparent 57%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.orb .bars { inset: auto; left: 50%; top: 50%; width: 26%; height: 20%; transform: translate(-50%, -50%); border-radius: 0;
  display: flex; align-items: center; gap: 4px; }
.orb .bars i { flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.92); }

.p-title { text-align: center; padding: 0 28px; }
.p-title .eyebrow { color: var(--amber); }
.p-title h2 { margin: 8px 0 0; font-size: 24px; line-height: 1.2;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.spacer { flex: 1 1 16px; min-height: 16px; }
.scrub { padding: 0 28px; }
#wave { width: 100%; height: 44px; touch-action: none; cursor: pointer; transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
#wave.drag { transform: scaleY(1.15); }
.times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.6); font-variant-numeric: tabular-nums; }
.controls { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 0; }
.rate { width: 52px; height: 32px; border-radius: 99px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.skipbtn svg { width: 34px; height: 34px; }
.mainplay { width: 80px; height: 80px; border-radius: 50%; background: var(--accent); display: grid; place-items: center;
  box-shadow: 0 0 18px rgba(255,120,33,.4), inset 0 0 0 1px rgba(255,255,255,.35); }
.mainplay svg { width: 32px; height: 32px; }
.mainplay .i-play { transform: translateX(3px); }
.mainplay .spinner { width: 30px; height: 30px; }
.p-error { text-align: center; color: var(--amber); font-size: 12px; min-height: 16px; margin-top: 8px; padding: 0 24px; }

/* ---------- Transcript-sheet ---------- */
#scrim { position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .35s; }
#scrim.show { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; max-width: 600px; margin: 0 auto;
  max-height: 86dvh; border-radius: 32px 32px 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 10px 24px calc(var(--sb) + 28px);
  transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.9,.25,1);
  background: rgba(30, 18, 54, .72);
}
#sheet.show { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); margin: 0 auto 18px; }
#sheet h3 { font-family: var(--serif); font-size: 22px; font-weight: 700; margin: 0 0 16px; }
#sheet ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
#sheet ol li { display: flex; gap: 12px; align-items: baseline; font-size: 15px; line-height: 1.4; }
#sheet ol li span { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--warm); color: var(--ink);
  font-size: 12px; font-weight: 700; display: grid; place-items: center; transform: translateY(4px); }
#sheet hr { border: 0; height: 1px; background: rgba(255,255,255,.15); margin: 22px 0 18px; }
#sheet .eyebrow { color: var(--amber); }
.transcript p { font-family: var(--serif); font-size: 17px; line-height: 1.65; color: rgba(255,255,255,.85); margin: 12px 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<canvas id="aurora" aria-hidden="true"></canvas>
<div class="aurora-shade" aria-hidden="true"></div>

<main id="home">
  <header>
    <div class="eyebrow" id="today"></div>
    <h1 class="display">AI Nieuws <span class="dot"></span></h1>
    <p>Het belangrijkste uit de wereld van AI, elke ochtend in vijf minuten.</p>
  </header>
  <div id="install-slot"></div>
  <div id="hero-slot"><div class="loading"><div class="spinner"></div></div></div>
  <section id="archive-slot"></section>
  <footer>Liever in een podcast-app? <a href="feed.xml">RSS-feed</a></footer>
</main>

<div id="mini" class="glass" role="button" aria-label="Open speler">
  <div class="mini-orb press" id="miniOrb"><div class="mini-bars"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="mini-text"><strong id="miniTitle"></strong><small id="miniTime">0:00 / 0:00</small></div>
  <button class="ctl skip press" data-act="back" aria-label="15 seconden terug"></button>
  <button class="ctl press" data-act="toggle" aria-label="Afspelen of pauzeren" id="miniToggle"></button>
  <div class="mini-prog"><i id="miniProg"></i></div>
</div>

<section id="player" aria-label="Speler" aria-hidden="true">
  <div class="p-inner">
    <div class="topbar">
      <button class="round press" data-act="close" aria-label="Sluit speler" id="closeBtn"></button>
      <div class="mid"><div class="eyebrow">Speelt nu</div><div>AI Nieuws</div></div>
      <button class="round press" data-act="transcript" aria-label="Transcript" id="quoteBtn"></button>
    </div>
    <div class="orb-wrap">
      <div class="orb" id="orb">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
        <div class="glow"></div>
        <div class="core"><div class="spin"></div><div class="shine"></div></div>
        <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div class="p-title">
      <div class="eyebrow" id="pDay"></div>
      <h2 class="display" id="pTitle"></h2>
    </div>
    <div class="spacer"></div>
    <div class="scrub">
      <canvas id="wave" aria-label="Positie in aflevering"></canvas>
      <div class="times"><span id="tCur">0:00</span><span id="tLeft">-0:00</span></div>
    </div>
    <div class="controls">
      <button class="rate press" data-act="rate" id="rateBtn">1×</button>
      <button class="skipbtn press" data-act="back" aria-label="15 seconden terug"></button>
      <button class="mainplay press" data-act="toggle" aria-label="Afspelen of pauzeren" id="mainToggle"></button>
      <button class="skipbtn press" data-act="fwd" aria-label="15 seconden vooruit"></button>
      <span style="width:52px"></span>
    </div>
    <div class="p-error" id="pError"></div>
    <div class="spacer" style="flex-grow:1.5"></div>
  </div>
</section>

<div id="scrim" data-act="sheetclose"></div>
<aside id="sheet" class="glass" aria-label="Transcript"></aside>

<audio id="audio" preload="none" playsinline></audio>

<script>
(() => {
'use strict';

// ---------- Iconen ----------
const ICON = {
  play: '<svg class="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.6v14.8a1.1 1.1 0 0 0 1.7.94l12-7.4a1.1 1.1 0 0 0 0-1.88l-12-7.4A1.1 1.1 0 0 0 7 4.6z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect fill="currentColor" x="5.5" y="4" width="4.6" height="16" rx="1.4"/><rect fill="currentColor" x="13.9" y="4" width="4.6" height="16" rx="1.4"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  quote: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5l3.2 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  wave: '<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14 24v0M19 19v10M24 14v20M29 19v10M34 24v0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
  skip(dir) {
    const flip = dir > 0 ? ' transform="matrix(-1 0 0 1 32 0)"' : '';
    return `<svg viewBox="0 0 32 32"><g${flip} fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4.5A11.5 11.5 0 1 1 5.3 11.8"/><path d="M18.6 1.6L15.3 4.6l3.3 3"/></g><text x="16" y="20.6" text-anchor="middle" font-size="9.5" font-weight="700" font-family="-apple-system,system-ui,sans-serif" fill="currentColor">15</text></svg>`;
  },
};
const SPINNER = '<div class="spinner"></div>';
const EQ = '<span class="eq"><i></i><i></i><i></i></span>';

// ---------- Hulpjes ----------
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const fmtDay = new Intl.DateTimeFormat('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtTime = new Intl.DateTimeFormat('nl-NL', { hour: '2-digit', minute: '2-digit' });
const fmtMon = new Intl.DateTimeFormat('nl-NL', { month: 'short' });
const clock = (s) => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const minutes = (s) => `${Math.max(1, Math.round((s || 0) / 60))} min`;
const isToday = (d) => d.toDateString() === new Date().toDateString();
const dayLabel = (ep) => fmtDay.format(new Date(ep.publishedAt));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// Luisterpositie en beluisterde afleveringen (zelfde logica als de iOS-app).
const progress = {
  pos: (id) => parseFloat(store.get('pos.' + id)) || 0,
  save: (id, t) => store.set('pos.' + id, String(t)),
  done: (id) => store.get('done.' + id) === '1',
  finish(id) { store.set('done.' + id, '1'); store.set('pos.' + id, '0'); },
  fraction(ep) {
    if (this.done(ep.id)) return 1;
    return ep.duration > 0 ? Math.min(1, this.pos(ep.id) / ep.duration) : 0;
  },
};

// Deterministische 'golfvorm' per aflevering (identiek aan de Swift-versie).
function waveform(id, count) {
  const M = (1n << 64n) - 1n;
  let seed = 5381n;
  for (const b of new TextEncoder().encode(id)) seed = ((seed << 5n) + seed + BigInt(b)) & M;
  seed |= 1n;
  const out = [];
  for (let i = 0; i < count; i++) {
    seed = (seed * 6364136223846793005n + 1442695040888963407n) & M;
    const noise = Number(seed >> 33n) / 4294967295;
    const env = 0.55 + 0.45 * Math.sin((i / count) * Math.PI * 6);
    out.push(0.25 + 0.75 * (0.5 * noise + 0.5 * env));
  }
  return out;
}

// ---------- Toestand ----------
const S = {
  episodes: [], loaded: false, error: null,
  current: null, playing: false, loading: false, playError: null,
  rate: 1, level: 0, history: new Array(40).fill(0),
  env: null, playerOpen: false, wave: [],
};
const RATES = [1, 1.25, 1.5, 0.75];
const audio = $('#audio');
let pendingSeek = null;

// ---------- Feed ----------
function setFeed(feed) {
  S.episodes = (feed.episodes || []).slice().sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
  S.loaded = true;
}
const cached = store.get('feed');
if (cached) { try { setFeed(JSON.parse(cached)); } catch {} }

async function refresh() {
  try {
    const res = await fetch(`episodes.json?t=${Date.now()}`, { cache: 'no-store' });
    if (res.status === 404) { S.loaded = true; S.error = S.episodes.length ? null : 'Nog geen afleveringen gepubliceerd. De eerste verschijnt om 08:00.'; return render(); }
    const text = await res.text();
    setFeed(JSON.parse(text));
    store.set('feed', text);
    S.error = S.episodes.length ? null : 'Nog geen afleveringen gepubliceerd. De eerste verschijnt om 08:00.';
  } catch {
    S.loaded = true;
    S.error = S.episodes.length ? null : 'Kon de afleveringen niet laden. Controleer je verbinding.';
  }
  render();
}

// ---------- Weergave home ----------
function render() {
  $('#today').textContent = fmtDay.format(new Date());
  const [latest, ...archive] = S.episodes;
  const heroSlot = $('#hero-slot');
  if (latest) heroSlot.innerHTML = heroHTML(latest);
  else if (!S.loaded) heroSlot.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  else heroSlot.innerHTML = `<div class="glass empty">${ICON.wave}${esc(S.error || 'Nog geen afleveringen.')}</div>`;

  $('#archive-slot').innerHTML = archive.length
    ? `<div class="eyebrow section-title">Eerdere afleveringen</div><div class="glass archive">${archive.map(rowHTML).join('')}</div>`
    : '';
  renderPlayState();
}

function heroHTML(ep) {
  const d = new Date(ep.publishedAt);
  const cur = S.current?.id === ep.id;
  const playing = cur && S.playing;
  const label = cur ? (playing ? 'Speelt nu' : 'Gepauzeerd') : 'Luister naar de briefing';
  return `<article class="glass hero" data-id="${esc(ep.id)}">
    <div class="hero-top"><span class="eyebrow pill">${isToday(d) ? 'Vandaag' : esc(fmtDay.format(d))}</span>
      <span class="dur">${ICON.clock}${minutes(ep.duration)}</span></div>
    <h2 class="display">${esc(ep.title)}</h2>
    <p class="summary">${esc(ep.summary)}</p>
    <ol class="headlines">${(ep.headlines || []).slice(0, 4).map((h, i) => `<li><span>${String(i + 1).padStart(2, '0')}</span>${esc(h)}</li>`).join('')}</ol>
    <div class="hero-play">
      <button class="bigplay press" id="heroPlay" data-play="${esc(ep.id)}" aria-label="${playing ? 'Pauzeer' : 'Speel af'}">${playing ? ICON.pause : ICON.play}</button>
      <div class="hp-text"><strong>${label}</strong>${cur ? '<div class="bar"><i id="heroProg"></i></div>' : `<small>${fmtTime.format(d)} · Zakelijk nieuwsbulletin</small>`}</div>
      ${playing ? EQ : ''}
    </div>
  </article>`;
}

function rowHTML(ep) {
  const d = new Date(ep.publishedAt);
  const f = progress.fraction(ep);
  const status = f >= 1 ? `<span style="gap:4px">${ICON.check}Beluisterd</span>` : f > 0 ? `<span class="bar"><i style="width:${(f * 100).toFixed(1)}%"></i></span>` : '';
  const playing = S.current?.id === ep.id && S.playing;
  return `<button class="ep" data-play="${esc(ep.id)}">
    <span class="date"><b>${d.getDate()}</b><small>${esc(fmtMon.format(d).replace('.', '').toUpperCase())}</small></span>
    <span class="meta"><strong>${esc(ep.title)}</strong><span>${minutes(ep.duration)}${status}</span></span>
    <span class="go">${playing ? EQ : `<span class="circle">${ICON.play}</span>`}</span>
  </button>`;
}

// Alleen de onderdelen die van afspeelstatus afhangen.
function renderPlayState() {
  const ep = S.current;
  $('#mini').classList.toggle('show', !!ep);
  const icon = S.loading ? SPINNER : S.playing ? ICON.pause : ICON.play;
  $('#mainToggle').innerHTML = icon;
  $('#miniToggle').innerHTML = S.playing ? ICON.pause : ICON.play;
  $('#rateBtn').textContent = (Number.isInteger(S.rate) ? S.rate : String(S.rate).replace('.', ',')) + '×';
  $('#pError').textContent = S.playError || '';
  if (ep) {
    $('#miniTitle').textContent = ep.title;
    $('#pDay').textContent = dayLabel(ep);
    $('#pTitle').textContent = ep.title;
  }
}

function setPlaying(v) {
  if (S.playing === v) return;
  S.playing = v;
  render();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = v ? 'playing' : 'paused';
}

// ---------- Afspelen ----------
const duration = () => (Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : S.current?.duration || 0);

function play(ep) {
  if (S.current?.id === ep.id && audio.src) { resume(); return; }
  saveProgress();
  S.current = ep;
  S.playError = null;
  S.loading = true;
  S.env = null;
  S.wave = waveform(ep.id, 64);
  const saved = progress.pos(ep.id);
  pendingSeek = saved < ep.duration - 5 ? saved : 0;
  audio.src = ep.audioURL;
  audio.preload = 'auto';
  audio.playbackRate = S.rate;
  audio.play().catch(onPlayError);
  setMeta(ep);
  loadEnvelope(ep);
  render();
}
function resume() { audio.play().catch(onPlayError); }
function pause() { audio.pause(); }
function toggle() { if (!S.current) return; if (S.playing) pause(); else play(S.current); }
function seek(t) {
  const d = duration();
  t = clamp(t, 0, d || 0);
  if (audio.readyState >= 1) audio.currentTime = t; else pendingSeek = t;
  saveProgress(t);
  updatePosition();
}
function skip(s) { seek((audio.readyState >= 1 ? audio.currentTime : pendingSeek || 0) + s); }
function cycleRate() {
  S.rate = RATES[(RATES.indexOf(S.rate) + 1) % RATES.length];
  audio.playbackRate = S.rate;
  renderPlayState();
  updatePosition();
}
function saveProgress(t) {
  if (!S.current) return;
  const pos = t ?? (audio.readyState >= 1 ? audio.currentTime : null);
  if (pos != null && !progress.done(S.current.id)) progress.save(S.current.id, pos);
}
function onPlayError(err) {
  if (err && err.name === 'AbortError') return;
  S.loading = false;
  S.playError = err && err.name === 'NotAllowedError' ? 'Tik op afspelen om te starten.' : 'Afspelen mislukt. Controleer je verbinding.';
  renderPlayState();
}

audio.addEventListener('loadedmetadata', () => {
  audio.playbackRate = S.rate;
  if (pendingSeek != null) { try { audio.currentTime = pendingSeek; } catch {} pendingSeek = null; }
  updatePosition();
});
audio.addEventListener('play', () => { audio.playbackRate = S.rate; setPlaying(true); });
audio.addEventListener('playing', () => { S.loading = false; S.playError = null; renderPlayState(); updatePosition(); });
audio.addEventListener('waiting', () => { S.loading = true; renderPlayState(); });
audio.addEventListener('canplay', () => { if (S.loading) { S.loading = false; renderPlayState(); } });
audio.addEventListener('pause', () => { saveProgress(); setPlaying(false); updatePosition(); });
audio.addEventListener('ended', () => {
  if (S.current) progress.finish(S.current.id);
  audio.currentTime = 0;
  setPlaying(false);
});
audio.addEventListener('error', () => { if (audio.src) onPlayError({ name: 'MediaError' }); });
let lastSave = 0;
audio.addEventListener('timeupdate', () => {
  const now = Date.now();
  if (now - lastSave > 5000) { lastSave = now; saveProgress(); updatePosition(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveProgress();
  else refresh();
});

// ---------- Vergrendelscherm / Bedieningspaneel ----------
function setMeta(ep) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: ep.title, artist: 'AI Nieuws', album: cap(dayLabel(ep)),
    artwork: [{ src: new URL('icons/cover-512.png', location.href).href, sizes: '512x512', type: 'image/png' }],
  });
}
function updatePosition() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = duration();
  if (!d) return;
  try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: S.rate, position: clamp(audio.currentTime || 0, 0, d) }); } catch {}
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const set = (a, h) => { try { ms.setActionHandler(a, h); } catch {} };
  set('play', () => resume());
  set('pause', () => pause());
  set('seekbackward', (e) => skip(-(e.seekOffset || 15)));
  set('seekforward', (e) => skip(e.seekOffset || 15));
  set('seekto', (e) => seek(e.seekTime));
}

// ---------- Stemniveau ----------
// De iOS-app meet het volume live. Hier berekenen we het één keer per aflevering uit de mp3
// (20 waarden per seconde) en bewaren het, zodat het afspelen zelf gewoon via de
// standaard audiospeler loopt en dus ook met vergrendeld scherm doorspeelt.
async function loadEnvelope(ep) {
  const key = 'env1.' + ep.id;
  const hit = store.get(key);
  if (hit) {
    try { S.env = Uint8Array.from(atob(hit), (c) => c.charCodeAt(0)); return; } catch {}
  }
  try {
    const buf = await (await fetch(ep.audioURL)).arrayBuffer();
    if (S.current?.id !== ep.id) return;
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    let ctx;
    try { ctx = new Ctx(1, 1, 8000); } catch { ctx = new Ctx(1, 1, 22050); }
    const decoded = await new Promise((ok, fail) => {
      const p = ctx.decodeAudioData(buf, ok, fail);
      if (p && p.then) p.then(ok, fail);
    });
    const data = decoded.getChannelData(0);
    const win = Math.max(1, Math.round(decoded.sampleRate / 20));
    const n = Math.ceil(data.length / win);
    const out = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const a = i * win, b = Math.min(data.length, a + win);
      let sum = 0;
      for (let j = a; j < b; j++) sum += data[j] * data[j];
      const db = 20 * Math.log10(Math.sqrt(sum / Math.max(1, b - a)) + 1e-9);
      out[i] = Math.round(Math.pow(clamp((db + 45) / 40, 0, 1), 1.6) * 255);
    }
    let bin = '';
    for (let i = 0; i < out.length; i++) bin += String.fromCharCode(out[i]);
    store.set(key, btoa(bin));
    if (S.current?.id === ep.id) S.env = out;
  } catch { /* dan blijft het gesimuleerde niveau actief */ }
}

function levelAt(t, now) {
  if (S.env && S.env.length) {
    const x = t * 20, i = Math.floor(x), f = x - i;
    const a = S.env[clamp(i, 0, S.env.length - 1)], b = S.env[clamp(i + 1, 0, S.env.length - 1)];
    return (a + (b - a) * f) / 255;
  }
  const s = now / 1000; // gesimuleerd tot het echte niveau klaar is
  return clamp(0.42 + 0.22 * Math.sin(s * 11) * Math.sin(s * 3.7) + 0.12 * Math.sin(s * 23), 0, 1);
}

// ---------- Achtergrond (mesh-gradient) ----------
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const C = { ink: rgb('#0f081f'), plum: rgb('#301257'), violet: rgb('#753be0'), orange: rgb('#ff7821'), ember: rgb('#c74229') };
const over = (c, a) => c.map((v, i) => v * a + C.ink[i] * (1 - a));
const MESH = [C.ink, C.plum, C.ink, C.plum, over(C.violet, .85), C.plum, C.ember, over(C.orange, .9), over(C.violet, .9)]
  .map((c) => over(c, 0.8)); // donkere waas eroverheen, zoals in de app
const auroraCv = $('#aurora');
const actx = auroraCv.getContext('2d');
let AW = 30, AH = 60, aImg;
function sizeAurora() {
  const ratio = innerWidth > 0 && innerHeight > 0 ? innerHeight / innerWidth : 2;
  AH = Math.round(AW * clamp(ratio, 1, 3));
  auroraCv.width = AW; auroraCv.height = AH;
  aImg = actx.createImageData(AW, AH);
}
function drawAurora(t, energy) {
  const a = 0.07 + energy * 0.07;
  const P = [
    [0, 0], [0.5 + a * Math.sin(t * 0.31), 0], [1, 0],
    [0, 0.5 + a * Math.cos(t * 0.37)], [0.5 + a * Math.sin(t * 0.43 + 1), 0.5 + a * Math.cos(t * 0.29 + 2)], [1, 0.5 + a * Math.sin(t * 0.41 + 2)],
    [0, 1], [0.5 + a * Math.cos(t * 0.33 + 1), 1], [1, 1],
  ];
  const d = aImg.data, inv = 1 / (2 * 0.26 * 0.26);
  let o = 0;
  for (let y = 0; y < AH; y++) {
    const v = y / (AH - 1);
    for (let x = 0; x < AW; x++) {
      const u = x / (AW - 1);
      let r = 0, g = 0, b = 0, ws = 0;
      for (let k = 0; k < 9; k++) {
        const dx = u - P[k][0], dy = v - P[k][1];
        const w = Math.exp(-(dx * dx + dy * dy) * inv);
        const c = MESH[k];
        r += c[0] * w; g += c[1] * w; b += c[2] * w; ws += w;
      }
      d[o++] = r / ws; d[o++] = g / ws; d[o++] = b / ws; d[o++] = 255;
    }
  }
  actx.putImageData(aImg, 0, 0);
}

// ---------- Golfvorm-scrubber ----------
const waveCv = $('#wave');
const wctx = waveCv.getContext('2d');
let drag = null;
function sizeWave() {
  const r = waveCv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  waveCv.width = Math.round(r.width * dpr); waveCv.height = Math.round(r.height * dpr);
}
function drawWave(prog) {
  const W = waveCv.width, H = waveCv.height;
  if (!W || !S.wave.length) return;
  const dpr = devicePixelRatio || 1, n = S.wave.length, gap = 2.5 * dpr;
  const bw = Math.max(1.5 * dpr, (W - gap * (n - 1)) / n);
  wctx.clearRect(0, 0, W, H);
  const grad = wctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#753be0'); grad.addColorStop(1, '#ff7821');
  const shown = drag ?? prog;
  for (let i = 0; i < n; i++) {
    const x = i * (bw + gap);
    const played = (x + bw / 2) / W <= shown;
    let v = S.wave[i];
    if (played || Math.abs(i / n - shown) * n < 4) {
      const dd = Math.abs(i / n - shown) * n;
      v = Math.min(1, v * (1 + S.level * 0.5 * Math.max(0, 1 - dd / 4)));
    }
    const h = Math.max(3 * dpr, H * v);
    wctx.fillStyle = played ? grad : 'rgba(255,255,255,.18)';
    wctx.beginPath();
    if (wctx.roundRect) wctx.roundRect(x, (H - h) / 2, bw, h, bw / 2); else wctx.rect(x, (H - h) / 2, bw, h);
    wctx.fill();
  }
}
const waveProg = (e) => { const r = waveCv.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); };
waveCv.addEventListener('pointerdown', (e) => { waveCv.setPointerCapture(e.pointerId); drag = waveProg(e); waveCv.classList.add('drag'); });
waveCv.addEventListener('pointermove', (e) => { if (drag != null) drag = waveProg(e); });
const endDrag = () => { if (drag == null) return; seek(drag * duration()); drag = null; waveCv.classList.remove('drag'); };
waveCv.addEventListener('pointerup', endDrag);
waveCv.addEventListener('pointercancel', () => { drag = null; waveCv.classList.remove('drag'); });

// ---------- Bol ----------
const orb = $('#orb');
const rings = orb.querySelectorAll('.ring');
const glow = orb.querySelector('.glow');
const core = orb.querySelector('.core');
const spin = orb.querySelector('.spin');
const orbBars = orb.querySelectorAll('.bars i');
let orbSize = 300;
function sizeOrb() {
  orbSize = orb.getBoundingClientRect().width || 300;
  glow.style.filter = `blur(${orbSize * 0.12}px)`;
}
const SHAPE = [0.45, 0.75, 1, 0.75, 0.45];
function drawOrb(t) {
  const L = S.level;
  rings.forEach((r, i) => {
    const ph = (t * 0.35 + i / 3) % 1;
    r.style.transform = `scale(${0.62 + ph * 0.42})`;
    r.style.opacity = S.playing ? (1 - ph) * (0.25 + L * 0.6) : 0;
  });
  glow.style.transform = `scale(${0.7 + L * 0.3}) rotate(${(t * 30) % 360}deg)`;
  core.style.transform = `scale(${0.56 + L * 0.07})`;
  core.style.boxShadow = `0 0 30px rgba(255,120,33,${0.35 + L * 0.4})`;
  spin.style.transform = `rotate(${(-t * 22) % 360}deg)`;
  const bh = orbSize * 0.2;
  orbBars.forEach((b, i) => {
    const w = 0.5 + 0.5 * Math.sin(t * 9 + i * 1.7);
    const v = Math.max(0.12, L * SHAPE[i] * (0.65 + 0.35 * w));
    b.style.height = Math.max(6, bh * v) + 'px';
  });
}

// ---------- Animatielus ----------
const miniBars = $$('.mini-bars i');
let last = performance.now(), histAcc = 0, auroraAcc = 1;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  const t = now / 1000;
  const target = S.playing && !S.loading ? levelAt(audio.currentTime || 0, now) : 0;
  const k = target > S.level ? 0.45 : 0.12;
  S.level += (target - S.level) * (1 - Math.pow(1 - k, dt * 30));
  histAcc += dt;
  if (histAcc >= 1 / 15) { histAcc = 0; S.history.shift(); S.history.push(S.level); }

  auroraAcc += dt;
  if (auroraAcc >= 1 / 30) { auroraAcc = 0; drawAurora(t, S.playerOpen ? S.level : S.level * 0.5); }

  if (S.current) {
    const d = duration(), cur = drag != null ? drag * d : (audio.readyState >= 1 ? audio.currentTime : pendingSeek || 0);
    const p = d ? cur / d : 0;
    $('#miniProg').style.width = (p * 100) + '%';
    $('#miniTime').textContent = `${clock(cur)} / ${clock(d)}`;
    const hp = $('#heroProg'); if (hp) hp.style.width = (p * 100) + '%';
    const hb = $('#heroPlay');
    if (hb && hb.dataset.play === S.current.id) {
      hb.style.transform = S.playing ? `scale(${1 + S.level * 0.08})` : '';
      hb.style.boxShadow = `0 0 ${S.playing ? 22 : 12}px rgba(255,120,33,.5), inset 0 0 0 1px rgba(255,255,255,.3)`;
    }
    $('#miniOrb').style.transform = `scale(${1 + S.level * 0.08})`;
    const hist = S.history.slice(-5);
    miniBars.forEach((b, i) => { b.style.height = Math.max(3, 16 * Math.max(0.15, hist[i])) + 'px'; });
    if (S.playerOpen) {
      $('#tCur').textContent = clock(cur);
      $('#tLeft').textContent = '-' + clock(d - cur);
      $('#mainToggle').style.boxShadow = `0 0 ${18 + S.level * 16}px rgba(255,120,33,${0.4 + S.level * 0.4}), inset 0 0 0 1px rgba(255,255,255,.35)`;
      drawOrb(t);
      drawWave(p);
    }
  }
  requestAnimationFrame(frame);
}

// ---------- Speler openen/sluiten, transcript ----------
function openPlayer() {
  if (!S.current) return;
  S.playerOpen = true;
  document.body.classList.add('player-open');
  $('#player').setAttribute('aria-hidden', 'false');
  requestAnimationFrame(() => { sizeWave(); sizeOrb(); });
}
function closePlayer() {
  closeSheet();
  S.playerOpen = false;
  document.body.classList.remove('player-open');
  $('#player').setAttribute('aria-hidden', 'true');
  render();
}
function openSheet() {
  const ep = S.current;
  if (!ep) return;
  const paras = (ep.transcript || '').split(/\n\s*\n/).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join('');
  $('#sheet').innerHTML = `<div class="grab"></div><h3>In deze aflevering</h3>
    <ol>${(ep.headlines || []).map((h, i) => `<li><span>${i + 1}</span>${esc(h)}</li>`).join('')}</ol>
    ${paras ? `<hr><div class="eyebrow">Transcript</div><div class="transcript">${paras}</div>` : ''}`;
  $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('show');
  $('#scrim').classList.add('show');
}
function closeSheet() { $('#sheet').classList.remove('show'); $('#scrim').classList.remove('show'); }

// Veeg de sheet omlaag om te sluiten.
(() => {
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', (e) => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  sh.addEventListener('touchmove', (e) => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  sh.addEventListener('touchend', () => {
    if (y0 == null) return;
    sh.style.transition = ''; sh.style.transform = '';
    if (dy > 90) closeSheet();
    y0 = null;
  });
})();

// ---------- Klikken ----------
function start(id) {
  const ep = S.episodes.find((e) => e.id === id);
  if (!ep) return;
  if (S.current?.id === ep.id) { toggle(); return; }
  play(ep);
  openPlayer();
}
document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act) {
    e.stopPropagation();
    ({ toggle, back: () => skip(-15), fwd: () => skip(15), rate: cycleRate, close: closePlayer,
       transcript: openSheet, sheetclose: closeSheet, dismiss: dismissInstall }[act.dataset.act] || (() => {}))();
    return;
  }
  const p = e.target.closest('[data-play]');
  if (p) { start(p.dataset.play); return; }
  if (e.target.closest('#mini')) openPlayer();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#sheet').classList.contains('show')) closeSheet(); else if (S.playerOpen) closePlayer(); }
  if (e.key === ' ' && S.current && e.target === document.body) { e.preventDefault(); toggle(); }
});

// ---------- Tip: zet op beginscherm ----------
function dismissInstall() { store.set('installDismissed', '1'); $('#install-slot').innerHTML = ''; }
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (ios && !standalone && !store.get('installDismissed')) {
  $('#install-slot').innerHTML = `<div class="glass install">${ICON.share}
    <div>Zet AI Nieuws op je beginscherm: tik op <b>Deel</b> en kies <b>Zet op beginscherm</b>.</div>
    <button class="x" data-act="dismiss" aria-label="Sluiten">${ICON.x}</button></div>`;
}

// ---------- Start ----------
$('#closeBtn').innerHTML = ICON.down;
$('#quoteBtn').innerHTML = ICON.quote;
$$('[data-act="back"]').forEach((b) => (b.innerHTML = ICON.skip(-1)));
$$('[data-act="fwd"]').forEach((b) => (b.innerHTML = ICON.skip(1)));
sizeAurora();
addEventListener('resize', () => { sizeAurora(); if (S.playerOpen) { sizeWave(); sizeOrb(); } });
addEventListener('pagehide', () => saveProgress());
render();
refresh();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
